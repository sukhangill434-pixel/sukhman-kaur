
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Website</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Website Header -->
    <header>
        <h1>My Website</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Home Section -->
    <main>
        <section id="home">
            <h2>Welcome to My Website!</h2>
            <p>This is my first website using HTML, CSS and JavaScript.</p>

            <button onclick="showMessage()">
                Click Me
            </button>

            <button onclick="changeBackground()">
                Change Background
            </button>
        </section>

        <!-- About Section -->
        <section id="about">
            <h2>About Us</h2>
            <p>Welcome! I am learning web development.</p>
        </section>

        <!-- Contact Section -->
        <section id="contact">
            <h2>Contact Us</h2>
            <p>Email: example@gmail.com</p>

            <button onclick="showDate()">
                Show Today's Date
            </button>

            <p id="date"></p>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My Website. All Rights Reserved.</p>
    </footer>

    <!-- Connect JavaScript -->
    <script src="script.js"></script>

</body>
</html>
